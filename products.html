<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twins for Agribusiness trading Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="nav.products">

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand"><span class="brand-mark">🌿</span><span data-i18n="brand"></span></a>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="index.html#about" data-i18n="nav.about"></a>
      <a href="products.html" class="active" data-i18n="nav.products"></a>
      <a href="index.html#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <button class="lang-btn" data-i18n="lang.switch"></button>
      <button class="menu-btn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1 data-i18n="p.title"></h1>
    <p data-i18n="p.text"></p>
  </div>
</section>

<div class="filters"><div class="container filters-inner"></div></div>

<main id="products-root"></main>

<div class="lightbox" role="dialog" aria-modal="true">
  <button class="lb-btn lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" aria-label="Previous"><span class="flip">‹</span></button>
  <img alt="">
  <button class="lb-btn lb-next" aria-label="Next"><span class="flip">›</span></button>
  <div class="lb-count"></div>
</div>

<footer class="site-footer" style="margin-top:50px">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="brand"><span class="brand-mark">🌿</span><span data-i18n="brand"></span></div>
        <p data-i18n="footer.about"></p>
      </div>
      <div>
        <h4 data-i18n="footer.links"></h4>
        <ul>
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li><a href="index.html#about" data-i18n="nav.about"></a></li>
          <li><a href="products.html" data-i18n="nav.products"></a></li>
          <li><a href="index.html#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-i18n="contact.eyebrow"></h4>
        <ul>
          <li><span data-phone dir="ltr"></span></li>
          <li><a data-email></a></li>
        </ul>
      </div>
    </div>
    <p class="copy">© <span data-year></span> <span data-i18n="brand"></span> — <span data-i18n="footer.rights"></span></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
