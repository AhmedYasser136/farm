<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حصاد النيل</title>
  <meta name="description" content="Egyptian fresh and frozen fruits and vegetables exporter — مصدّر فاكهة وخضروات مصرية طازجة ومجمدة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="nav.home">

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand"><span class="brand-mark">🌿</span><span data-i18n="brand"></span></a>
    <nav class="nav-links">
      <a href="index.html" class="active" data-i18n="nav.home"></a>
      <a href="index.html#about" data-i18n="nav.about"></a>
      <a href="products.html" data-i18n="nav.products"></a>
      <a href="index.html#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <button class="lang-btn" data-i18n="lang.switch"></button>
      <button class="menu-btn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="container hero-inner">
    <div>
      <span class="eyebrow" style="color:var(--orange)" data-i18n="hero.eyebrow"></span>
      <h1 data-i18n-html="hero.title"></h1>
      <p data-i18n="hero.text"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="products.html"><span data-i18n="hero.cta1"></span> <span class="flip">→</span></a>
        <a class="btn btn-ghost" href="#contact" data-i18n="hero.cta2"></a>
      </div>
      <div class="hero-stats">
        <div><b>3</b><span data-i18n="stat.1"></span></div>
        <div><b id="stat-photos" dir="ltr">160+</b><span data-i18n="stat.2"></span></div>
        <div><b>12</b><span data-i18n="stat.3"></span></div>
      </div>
    </div>
    <div class="slider">
      <div class="slider-frame"></div>
      <div class="slider-badge" data-i18n="slider.badge"></div>
      <div class="slider-controls">
        <button class="slider-prev" aria-label="Previous"><span class="flip">‹</span></button>
        <div class="slider-progress"><i></i></div>
        <button class="slider-next" aria-label="Next"><span class="flip">›</span></button>
      </div>
    </div>
  </div>
</section>

<section class="section" id="about">
  <div class="container about-grid">
    <div>
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h2 data-i18n="about.title"></h2>
      <p class="lead" data-i18n="about.text"></p>
      <ul class="checks">
        <li data-i18n="about.l1"></li>
        <li data-i18n="about.l2"></li>
        <li data-i18n="about.l3"></li>
        <li data-i18n="about.l4"></li>
      </ul>
    </div>
    <div class="about-photos"><img alt="" loading="lazy"><img alt="" loading="lazy"></div>
  </div>
</section>

<section class="section bg-white">
  <div class="container">
    <div class="section-head center">
      <span class="eyebrow" data-i18n="cat.eyebrow"></span>
      <h2 data-i18n="cat.title"></h2>
      <p class="lead" data-i18n="cat.text"></p>
    </div>
    <div class="cat-grid"></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head center">
      <span class="eyebrow" data-i18n="why.eyebrow"></span>
      <h2 data-i18n="why.title"></h2>
    </div>
    <div class="features">
      <div class="feature"><div class="ico"></div><h3 data-i18n="why.1"></h3><p data-i18n="why.1d"></p></div>
      <div class="feature"><div class="ico"></div><h3 data-i18n="why.2"></h3><p data-i18n="why.2d"></p></div>
      <div class="feature"><div class="ico"></div><h3 data-i18n="why.3"></h3><p data-i18n="why.3d"></p></div>
      <div class="feature"><div class="ico"></div><h3 data-i18n="why.4"></h3><p data-i18n="why.4d"></p></div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="cta-band">
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.text"></p>
      <a class="btn btn-primary" href="#contact" data-i18n="hero.cta2"></a>
    </div>
  </div>
</section>

<section class="section bg-white" id="contact">
  <div class="container contact-grid">
    <div>
      <span class="eyebrow" data-i18n="contact.eyebrow"></span>
      <h2 data-i18n="contact.title"></h2>
      <p class="lead" data-i18n="contact.text"></p>
      <ul class="contact-list">
        <li><span class="ci">📞</span><div><small data-i18n="contact.phone"></small><a data-phone dir="ltr"></a></div></li>
        <li><span class="ci">✉️</span><div><small data-i18n="contact.email"></small><a data-email></a></div></li>
        <li><span class="ci">📍</span><div><small data-i18n="contact.location"></small><span data-i18n="contact.loc.v"></span></div></li>
      </ul>
    </div>
    <form class="form" id="contact-form">
      <div class="row">
        <input name="name" required data-i18n-ph="form.name">
        <input name="company" data-i18n-ph="form.company">
      </div>
      <div class="row">
        <input name="email" type="email" data-i18n-ph="form.email">
        <input name="phone" data-i18n-ph="form.phone">
      </div>
      <textarea name="msg" rows="5" required data-i18n-ph="form.msg"></textarea>
      <button class="btn btn-primary" type="submit" data-i18n="form.send"></button>
      <div class="form-note"></div>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="brand"><span class="brand-mark">🌿</span><span data-i18n="brand"></span></div>
        <p data-i18n="footer.about"></p>
      </div>
      <div>
        <h4 data-i18n="footer.links"></h4>
        <ul>
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li><a href="index.html#about" data-i18n="nav.about"></a></li>
          <li><a href="products.html" data-i18n="nav.products"></a></li>
          <li><a href="index.html#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-i18n="footer.cats"></h4>
        <ul>
          <li><a href="products.html#fruits" data-i18n="cat.fruits"></a></li>
          <li><a href="products.html#vegetables" data-i18n="cat.vegetables"></a></li>
          <li><a href="products.html#frozen" data-i18n="cat.frozen"></a></li>
        </ul>
      </div>
    </div>
    <p class="copy">© <span data-year></span> <span data-i18n="brand"></span> — <span data-i18n="footer.rights"></span></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
